# =============================================================================
# PostgreSQL 17 for GitLab — deployed BEFORE GitLab, which connects to it
# (the Omnibus-bundled PostgreSQL is disabled). LAB/DEMO ONLY: single replica.
#
# Template rendered by scripts/30-gitlab-setup.sh with envsubst:
#   ${GITLAB_NAMESPACE} ${GITLAB_POSTGRES_IMAGE} ${GITLAB_CREDS_SECRET}
#   ${GITLAB_STORAGE_CLASS}
#
# Two databases in one instance:
#   gitlabhq_production — GitLab Rails (owner: gitlab, superuser so migrations
#                         can CREATE EXTENSION pg_trgm / btree_gist / amcheck)
#   registry            — Container Registry metadata DB (owner: registry)
# Passwords come from the credentials Secret generated by the setup script.
# =============================================================================
---
# First-init SQL: the image runs /docker-entrypoint-initdb.d/* once, on an
# empty PGDATA. Creates the separate `registry` role + database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-postgresql-init
  namespace: ${GITLAB_NAMESPACE}
  labels:
    app: gitlab-postgresql
data:
  10-registry-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-SQL
      CREATE ROLE registry LOGIN PASSWORD '${REGISTRY_DB_PASSWORD}';
      CREATE DATABASE registry OWNER registry;
    SQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-postgresql
  namespace: ${GITLAB_NAMESPACE}
  labels:
    app: gitlab-postgresql
spec:
  storageClassName: ${GITLAB_STORAGE_CLASS}
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-postgresql
  namespace: ${GITLAB_NAMESPACE}
  labels:
    app: gitlab-postgresql
    app.kubernetes.io/part-of: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO volume
  selector:
    matchLabels:
      app: gitlab-postgresql
  template:
    metadata:
      labels:
        app: gitlab-postgresql
    spec:
      # default ServiceAccount → restricted SCC (random UID); no anyuid needed
      containers:
        - name: postgresql
          image: ${GITLAB_POSTGRES_IMAGE}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: gitlab
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${GITLAB_CREDS_SECRET}
                  key: db-password
            - name: POSTGRES_DB
              value: gitlabhq_production
            - name: REGISTRY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${GITLAB_CREDS_SECRET}
                  key: registry-db-password
            # Sub-directory so initdb does not choke on a non-empty PVC root
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gitlab", "-d", "gitlabhq_production"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gitlab", "-d", "gitlabhq_production"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-postgresql
        - name: initdb
          configMap:
            name: gitlab-postgresql-init
            defaultMode: 0755
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-postgresql
  namespace: ${GITLAB_NAMESPACE}
  labels:
    app: gitlab-postgresql
spec:
  selector:
    app: gitlab-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
